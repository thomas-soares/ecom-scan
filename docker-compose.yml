services:
  postgres:
    image: postgres:16-alpine
    container_name: ecom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecom_scan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecom_scan"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ecom-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: node:22-alpine
    container_name: ecom-api
    working_dir: /app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecom_scan
      REDIS_URL: redis://redis:6379
    command: >
      sh -lc "
      corepack enable &&
      pnpm install &&
      pnpm exec prisma db push &&
      pnpm dev:api
      "
    ports:
      - "4000:4000"
    volumes:
      - ./:/app
      - api_node_modules:/app/node_modules

  worker:
    image: mcr.microsoft.com/playwright:v1.55.0-jammy
    container_name: ecom-worker
    working_dir: /app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecom_scan
      REDIS_URL: redis://redis:6379
    command: >
      sh -lc "
      corepack enable &&
      pnpm install &&
      pnpm dev:worker
      "
    volumes:
      - ./:/app
      - worker_node_modules:/app/node_modules

  web:
    image: node:22-alpine
    container_name: ecom-web
    working_dir: /app
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    command: >
      sh -lc "
      corepack enable &&
      pnpm install &&
      pnpm dev --hostname 0.0.0.0 --port 3000
      "
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules

volumes:
  postgres_data:
  redis_data:
  api_node_modules:
  worker_node_modules:
  web_node_modules:
